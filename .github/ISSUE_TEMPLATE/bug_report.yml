name: Bug report
description: Something isn't working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which part of the repository is affected?
      options:
        - domains/ingestion (Rust)
        - domains/gtfs_s (Python)
        - Repository governance (CI, hooks, lint configs)
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Command output, stack traces, panic messages, etc.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Rust/Python version (if relevant to the bug):
      render: markdown
    validations:
      required: false
