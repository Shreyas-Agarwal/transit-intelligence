name: Continuous Integration

# Per ADR 0013 (domain-first workspace organization), CI orchestrates domains
# rather than owning a shared build. This workflow never names a domain or
# its language: it lists domains/*/ directories at run time and runs `make
# ci` in each — a convention every domain is expected to provide (see
# domains/ingestion/Makefile). Adding a domain never
# requires editing this file.
#
# Toolchains for every domain (Rust, Python/uv, ...) come from the repo-root
# mise.toml via jdx/mise-action, installed once per job — the job doesn't
# know or care which of those toolchains the domain it's building actually
# uses.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    name: Discover domains
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.list.outputs.domains }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List domains/*/ directories
        id: list
        run: |
          domains=$(find domains -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "domains=$domains" >> "$GITHUB_OUTPUT"

  domain-ci:
    name: domains/${{ matrix.domain }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJson(needs.discover.outputs.domains) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchains (mise.toml)
        uses: jdx/mise-action@v2

      - name: make ci
        run: make -C "domains/${{ matrix.domain }}" ci
