# Thin root entrypoint (Vale requires StylesPath to be set relative to this
# file's location). Style packages live in tools/governance/vale/styles/,
# fetched via `vale sync` (run once after `mise install`).
StylesPath = tools/governance/vale/styles
MinAlertLevel = suggestion
Packages = write-good

# Vale only applies rules to paths with a matching glob section below.
# Scoped to prose docs only — no section is defined for source extensions
# (.rs, .py, ...), so Vale never examines code comments or domain source.
[*.md]
BasedOnStyles = write-good
# E-Prime (flags every "is"/"are"/"be") and Passive voice are both far too
# aggressive for this repo's dense, formal ADR/technical-doc style, which
# uses passive constructions and the verb "to be" constantly and
# deliberately (e.g. "X is adopted", "the decision is deferred"). The
# remaining write-good rules (wordiness, weasel words, clichés) are a
# reasonable, permissive baseline that doesn't fight the existing style.
write-good.E-Prime = NO
write-good.Passive = NO
