[project]
name = "transit-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.4",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pyright>=1.1.410",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length=100
target-version="py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]

[tool.pyright]
typeCheckingMode="basic"
