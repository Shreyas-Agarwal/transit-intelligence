[project]
name = "ingestion-transform"
version = "0.1.0"
description = "Bronze -> Silver transform pipeline for GTFS static snapshots"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.410",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]

[tool.pyright]
typeCheckingMode = "basic"
