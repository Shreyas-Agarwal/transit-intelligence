[package]
name = "ti-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
config.workspace = true
dotenvy.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-stdout.workspace = true
tracing-opentelemetry.workspace = true

[features]
# In-memory span/metric exporters for tests that assert on what observability
# actually recorded, instead of only on side effects. Kept behind a feature
# (rather than always-on) so crates that don't test observability directly
# don't pay for opentelemetry_sdk's `testing` feature in their normal builds.
observability-testing = ["opentelemetry_sdk/testing"]
